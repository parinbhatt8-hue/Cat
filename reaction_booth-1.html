<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Webcam.exe</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0;
    background: #008080;
    font-family: Tahoma, Verdana, "MS Sans Serif", Geneva, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    touch-action: pan-y;
  }
  #desktop {
    position: relative;
    min-height: 100vh;
    padding: 14px 10px 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  /* ---------- WINDOW CHROME ---------- */
  .win {
    width: min(94vw, 420px);
    background: #c0c0c0;
    border: 2px solid;
    border-color: #dfdfdf #0a0a0a #0a0a0a #dfdfdf;
    box-shadow: inset -1px -1px 0 #000, inset 1px 1px 0 #fff,
                2px 2px 6px rgba(0,0,0,0.4);
    position: relative;
  }
  .win.dragging { opacity: 0.92; }

  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 3px 4px 3px 6px;
    background: linear-gradient(90deg, #000080, #1084d0);
    cursor: grab;
    touch-action: none;
  }
  .titlebar.red { background: linear-gradient(90deg, #8a0000, #ff7a1a); }
  .titlebar-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .titlebar .icon {
    width: 16px; height: 16px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
  }
  .titlebar .title {
    color: #fff;
    font-size: 12.5px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .titlebar-buttons { display: flex; gap: 2px; flex-shrink: 0; }
  .tb-btn {
    width: 17px; height: 15px;
    background: #c0c0c0;
    border: 1px solid;
    border-color: #fff #0a0a0a #0a0a0a #fff;
    font-size: 10px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    color: #000;
    padding: 0;
    font-family: Tahoma, sans-serif;
    font-weight: bold;
  }
  .tb-btn:active {
    border-color: #0a0a0a #fff #fff #0a0a0a;
  }

  .menubar {
    display: flex;
    gap: 14px;
    padding: 3px 8px;
    background: #c0c0c0;
    border-bottom: 1px solid #808080;
    font-size: 11.5px;
  }
  .menubar span:active { background: #000080; color: #fff; padding: 0 2px; margin: 0 -2px; }

  .win-content { padding: 6px; }

  .statusbar {
    display: flex;
    gap: 4px;
    padding: 3px 5px;
    background: #c0c0c0;
  }
  .status-cell {
    flex: 1;
    border: 1px solid;
    border-color: #808080 #fff #fff #808080;
    padding: 2px 8px;
    font-size: 11px;
    background: #c0c0c0;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status-cell.right { flex: 0 0 auto; max-width: 46%; color: #333; }

  /* ---------- WEBCAM WINDOW ---------- */
  .shot {
    position: relative;
    background: #000;
    aspect-ratio: 4 / 3;
    border: 1px solid;
    border-color: #808080 #fff #fff #808080;
    overflow: hidden;
  }
  video, canvas.overlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  canvas.overlay { pointer-events: none; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 2px 2px;
    flex-wrap: wrap;
  }
  .btn98 {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #0a0a0a #0a0a0a #fff;
    font-family: Tahoma, sans-serif;
    font-size: 11.5px;
    padding: 5px 12px;
    color: #000;
  }
  .btn98:active { border-color: #0a0a0a #fff #fff #0a0a0a; }
  .btn98:disabled { color: #808080; text-shadow: 1px 1px 0 #fff; }

  .chk-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    margin-left: auto;
  }
  .chk98 {
    width: 13px; height: 13px;
    background: #fff;
    border: 1px solid;
    border-color: #808080 #fff #fff #808080;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; line-height: 1;
    flex-shrink: 0;
  }
  .chk98.on::after { content: "\2713"; }

  .hint98 {
    font-size: 11px;
    color: #000;
    padding: 6px 2px 0;
    min-height: 15px;
    line-height: 1.4;
  }

  /* ---------- MEME WINDOW ---------- */
  .print {
    position: relative;
    background: #808080;
    aspect-ratio: 1 / 1;
    border: 1px solid;
    border-color: #808080 #fff #fff #808080;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .print img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .print img.ready { opacity: 1; }
  .print .placeholder {
    color: #e0e0e0;
    font-size: 12px;
    text-align: center;
    padding: 0 24px;
  }

  /* ---------- TASKBAR ---------- */
  .taskbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 32px;
    background: #c0c0c0;
    border-top: 2px solid #fff;
    display: flex;
    align-items: center;
    padding: 0 4px;
    gap: 8px;
    z-index: 50;
  }
  .start-btn {
    display: flex; align-items: center; gap: 5px;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #0a0a0a #0a0a0a #fff;
    padding: 2px 8px 2px 4px;
    font-size: 11.5px;
    font-weight: bold;
    height: 24px;
  }
  .flag {
    width: 13px; height: 13px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1px;
  }
  .flag div:nth-child(1) { background: #ff4d4d; }
  .flag div:nth-child(2) { background: #7ed957; }
  .flag div:nth-child(3) { background: #4d9fff; }
  .flag div:nth-child(4) { background: #ffd23f; }
  .task-item {
    height: 24px;
    border: 1px solid;
    border-color: #808080 #fff #fff #808080;
    background: #dcdcdc;
    font-size: 11px;
    display: flex; align-items: center;
    padding: 0 10px;
    max-width: 150px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .clock {
    margin-left: auto;
    border: 1px solid;
    border-color: #808080 #fff #fff #808080;
    padding: 4px 10px;
    font-size: 11px;
    background: #c0c0c0;
  }
</style>
</head>
<body>
<div id="desktop">

  <div class="win" id="webcamWin" style="z-index:2;">
    <div class="titlebar" data-drag>
      <div class="titlebar-left">
        <span class="icon">&#128247;</span>
        <span class="title">Webcam.exe</span>
      </div>
      <div class="titlebar-buttons">
        <button class="tb-btn" data-fx>_</button>
        <button class="tb-btn" data-fx>&#9633;</button>
        <button class="tb-btn" data-fx>&times;</button>
      </div>
    </div>
    <div class="menubar"><span>File</span><span>View</span><span>Options</span><span>Help</span></div>
    <div class="win-content">
      <div class="shot">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay" class="overlay"></canvas>
      </div>
      <div class="toolbar">
        <button class="btn98" id="startBtn">Start Camera</button>
        <button class="btn98" id="calibrateBtn" disabled>Set Neutral</button>
        <div class="chk-row" id="debugToggle">
          <div class="chk98" id="chkBox"></div>
          <span>Show mesh</span>
        </div>
      </div>
      <div class="hint98" id="hint">Tap Start Camera to begin.</div>
    </div>
    <div class="statusbar">
      <div class="status-cell">Detected: <b id="detectedLabel">--</b></div>
    </div>
  </div>

  <div class="win" id="memeWin" style="z-index:1;">
    <div class="titlebar red" data-drag>
      <div class="titlebar-left">
        <span class="icon">&#128008;</span>
        <span class="title" id="memeWinTitle">meme_viewer.exe</span>
      </div>
      <div class="titlebar-buttons">
        <button class="tb-btn" data-fx>_</button>
        <button class="tb-btn" data-fx>&#9633;</button>
        <button class="tb-btn" data-fx>&times;</button>
      </div>
    </div>
    <div class="menubar"><span>File</span><span>Edit</span><span>View</span><span>Help</span></div>
    <div class="win-content">
      <div class="print">
        <img id="memeImg" alt="Cat reaction" />
        <div class="placeholder" id="memePlaceholder">Waiting for a face to react to...</div>
      </div>
    </div>
    <div class="statusbar">
      <div class="status-cell" id="categoryCell">--</div>
      <div class="status-cell right" id="filenameCell">--</div>
    </div>
  </div>

</div>

<div class="taskbar">
  <div class="start-btn"><div class="flag"><div></div><div></div><div></div><div></div></div>Start</div>
  <div class="task-item">Webcam.exe</div>
  <div class="task-item" id="taskbarMemeItem">meme_viewer.exe</div>
  <div class="clock" id="clock">--:--</div>
</div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ---------------- Clock ---------------- */
function tickClock() {
  const d = new Date();
  let h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  document.getElementById('clock').textContent =
    `${h}:${String(m).padStart(2,'0')} ${ampm}`;
}
tickClock(); setInterval(tickClock, 15000);

/* ---------------- Fake button press feedback ---------------- */
document.querySelectorAll('[data-fx]').forEach(b => {
  b.addEventListener('click', () => {
    b.style.transform = 'scale(0.94)';
    setTimeout(() => b.style.transform = '', 90);
  });
});

/* ---------------- Draggable windows ---------------- */
function makeDraggable(winEl) {
  const handle = winEl.querySelector('.titlebar');
  let dragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0, activated = false;

  handle.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.tb-btn')) return;
    dragging = true;
    winEl.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
    const rect = winEl.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY;
    origLeft = rect.left; origTop = rect.top;
    if (!activated) {
      winEl.style.position = 'fixed';
      winEl.style.margin = '0';
      winEl.style.left = origLeft + 'px';
      winEl.style.top = origTop + 'px';
      winEl.style.zIndex = 10;
      activated = true;
    }
  });
  handle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    winEl.style.left = (origLeft + dx) + 'px';
    winEl.style.top = (origTop + dy) + 'px';
  });
  function end(e) {
    if (!dragging) return;
    dragging = false;
    winEl.classList.remove('dragging');
  }
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);
}
makeDraggable(document.getElementById('webcamWin'));
makeDraggable(document.getElementById('memeWin'));

/* ---------------- Elements ---------------- */
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
const startBtn = document.getElementById('startBtn');
const calibrateBtn = document.getElementById('calibrateBtn');
const hint = document.getElementById('hint');
const detectedLabel = document.getElementById('detectedLabel');
const memeImg = document.getElementById('memeImg');
const memePlaceholder = document.getElementById('memePlaceholder');
const categoryCell = document.getElementById('categoryCell');
const filenameCell = document.getElementById('filenameCell');
const memeWinTitle = document.getElementById('memeWinTitle');
const taskbarMemeItem = document.getElementById('taskbarMemeItem');
const debugToggle = document.getElementById('debugToggle');
const chkBox = document.getElementById('chkBox');

let debugOn = false;
debugToggle.addEventListener('click', () => {
  debugOn = !debugOn;
  chkBox.classList.toggle('on', debugOn);
});

/* ---------------- Landmark math ---------------- */
const LEFT_EYE = [33, 160, 158, 133, 153, 144];
const RIGHT_EYE = [362, 385, 387, 263, 373, 380];
const LEFT_EYEBROW = 105, RIGHT_EYEBROW = 334;
const LEFT_EYE_TOP = 159, RIGHT_EYE_TOP = 386;
const MOUTH_LEFT = 61, MOUTH_RIGHT = 291, MOUTH_TOP = 13, MOUTH_BOTTOM = 14;
const FACE_LEFT = 234, FACE_RIGHT = 454;

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function eyeAspectRatio(lm, idx) {
  const [p1, p2, p3, p4, p5, p6] = idx.map(i => lm[i]);
  return (2.0 * dist(p1, p4)) ? (dist(p2, p6) + dist(p3, p5)) / (2.0 * dist(p1, p4)) : 0;
}
function mouthAspectRatio(lm) {
  const h = dist(lm[MOUTH_LEFT], lm[MOUTH_RIGHT]);
  return h ? dist(lm[MOUTH_TOP], lm[MOUTH_BOTTOM]) / h : 0;
}
function eyebrowRaise(lm) {
  const lGap = Math.abs(lm[LEFT_EYEBROW].y - lm[LEFT_EYE_TOP].y);
  const rGap = Math.abs(lm[RIGHT_EYEBROW].y - lm[RIGHT_EYE_TOP].y);
  const fw = dist(lm[FACE_LEFT], lm[FACE_RIGHT]);
  return fw ? ((lGap + rGap) / 2) / fw : 0;
}
function mouthCornerAngle(lm) {
  const mouthCenterY = (lm[MOUTH_TOP].y + lm[MOUTH_BOTTOM].y) / 2;
  const cornerAvgY = (lm[MOUTH_LEFT].y + lm[MOUTH_RIGHT].y) / 2;
  return (mouthCenterY - cornerAvgY) * 100;
}
function faceBBox(lm) {
  let minX=1,minY=1,maxX=0,maxY=0;
  for (const p of lm) {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  }
  return {minX,minY,maxX,maxY};
}

let baseline = null;
function classify(m) {
  if (!baseline) return 'neutral';
  const browDelta = m.brow - baseline.brow;
  const cornerDelta = m.corner - baseline.corner;
  const marRel = baseline.mar > 0.02 ? m.mar / baseline.mar : m.mar / 0.05;
  let label = 'neutral', margin = 0;
  if (browDelta > 0.045 && marRel > 1.6) { label = 'shocked'; margin = Math.min(browDelta*10, marRel-1.6); }
  else if (cornerDelta > 2.2 && m.mar > baseline.mar * 1.1) { label = 'happy'; margin = cornerDelta/5; }
  else if (browDelta < -0.02 && cornerDelta < -1.0) { label = 'angry'; margin = -cornerDelta/4; }
  else if (cornerDelta < -2.0) { label = 'sad'; margin = -cornerDelta/4; }
  const confidence = Math.max(60, Math.min(99, Math.round(68 + margin * 22)));
  return { label, confidence };
}

/* ---------------- Cat pools (preloaded, tag-matched) ---------------- */
const EMOTION_TAGS = {
  happy: ['happy','smile','cute'],
  sad: ['sad','crying','unhappy'],
  shocked: ['shocked','surprised','scared'],
  angry: ['angry','furious','grumpy'],
  neutral: ['relaxed','content','cool']
};
const CATEGORY_NAME = {
  happy: 'Smug Cat', sad: 'Sad Cat', shocked: 'Shocked Cat',
  angry: 'Angry Cat', neutral: 'Chill Cat'
};
const pools = { happy: [], sad: [], shocked: [], angry: [], neutral: [] };
const IMAGES_PER_TAG = 2; // pool size per emotion = tags.length * this

function fakeFilename(entry) {
  return `${entry.tag}-${entry.n}.${entry.ext}`;
}

// Uses <img> preloading against cataas's direct tag endpoint (no fetch/XHR,
// so the missing CORS headers on cataas's API don't matter — image loads
// are exempt from CORS since we never read pixels back).
function buildPool(emotion) {
  const tags = EMOTION_TAGS[emotion];
  const EXTS = ['jpg','jpeg','png','webp'];
  tags.forEach(tag => {
    for (let i = 0; i < IMAGES_PER_TAG; i++) {
      const n = Math.floor(Math.random() * 899) + 1;
      const ext = EXTS[(n + i) % EXTS.length];
      const url = `https://cataas.com/cat/${encodeURIComponent(tag)}?width=480&height=480&r=${n}${i}`;
      const entry = { url, tag, n, ext };
      const im = new Image();
      im.onload = () => pools[emotion].push(entry); // only counts once it actually loaded
      im.onerror = () => {}; // silently skip broken ones; fallback covers it
      im.src = url;
    }
  });
}

function preloadAllPools() {
  Object.keys(EMOTION_TAGS).forEach(buildPool);
}
preloadAllPools(); // fire immediately, non-blocking

function updateMeme(label) {
  const catName = CATEGORY_NAME[label] || 'Cat';
  memeWinTitle.textContent = `${catName} - meme_viewer.exe`;
  taskbarMemeItem.textContent = `${catName} - meme_viewer.exe`;
  categoryCell.textContent = catName;

  const pool = pools[label];
  if (pool && pool.length > 0) {
    const entry = pool[Math.floor(Math.random() * pool.length)];
    memeImg.classList.remove('ready');
    memeImg.onload = () => memeImg.classList.add('ready');
    memeImg.src = entry.url;
    memePlaceholder.style.display = 'none';
    filenameCell.textContent = fakeFilename(entry);
  } else {
    // fallback if pool not ready yet
    const url = `https://cataas.com/cat/says/${encodeURIComponent(label)}?type=square&fontSize=50&fontColor=white&_=${Date.now()}`;
    memeImg.classList.remove('ready');
    memeImg.onload = () => memeImg.classList.add('ready');
    memeImg.src = url;
    memePlaceholder.style.display = 'none';
    filenameCell.textContent = `${label}.jpg`;
  }
}

/* ---------------- Stability filter (fast) ---------------- */
let pendingLabel = 'neutral', pendingCount = 0, appliedLabel = null;
const STABILITY_FRAMES = 3;
function stabilize(label) {
  if (label === pendingLabel) pendingCount++;
  else { pendingLabel = label; pendingCount = 1; }
  if (pendingCount >= STABILITY_FRAMES && label !== appliedLabel) {
    appliedLabel = label;
    updateMeme(label);
  }
}

/* ---------------- Camera + model ---------------- */
let faceLandmarker = null;
let running = false;
let lastMetrics = null;
let lastInferenceTime = 0;
const INFERENCE_INTERVAL_MS = 80; // ~12fps inference, plenty for expression tracking

async function initModel() {
  hint.textContent = 'Loading face model...';
  const filesetResolver = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  const base = {
    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
  };
  try {
    faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
      baseOptions: { ...base, delegate: "GPU" },
      outputFaceBlendshapes: false, runningMode: "VIDEO", numFaces: 1
    });
  } catch (e) {
    faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
      baseOptions: { ...base, delegate: "CPU" },
      outputFaceBlendshapes: false, runningMode: "VIDEO", numFaces: 1
    });
  }
}

async function startCamera() {
  startBtn.disabled = true;
  hint.textContent = 'Requesting camera permission...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 360 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    hint.textContent = 'Camera permission denied. Allow camera access and reload.';
    startBtn.disabled = false;
    return;
  }

  if (!faceLandmarker) await initModel();

  overlay.width = video.videoWidth || 480;
  overlay.height = video.videoHeight || 360;

  hint.textContent = 'Hold a neutral face, then tap "Set Neutral" for accurate reads.';
  detectedLabel.textContent = 'scanning...';
  calibrateBtn.disabled = false;
  startBtn.textContent = 'Camera running';
  running = true;
  requestAnimationFrame(loop);
}

calibrateBtn.addEventListener('click', () => {
  if (lastMetrics) {
    baseline = { ...lastMetrics };
    hint.textContent = 'Neutral set. Try smiling, gasping, frowning, or a raised brow.';
  }
});

function drawBBoxAndMesh(lm, label, confidence) {
  octx.clearRect(0, 0, overlay.width, overlay.height);
  const w = overlay.width, h = overlay.height;

  if (debugOn) {
    octx.fillStyle = 'rgba(255,209,63,0.5)';
    for (const pt of lm) {
      octx.beginPath();
      octx.arc(pt.x * w, pt.y * h, 1, 0, Math.PI * 2);
      octx.fill();
    }
  }

  const bb = faceBBox(lm);
  const padX = (bb.maxX - bb.minX) * 0.12, padY = (bb.maxY - bb.minY) * 0.12;
  const x = (bb.minX - padX) * w, y = (bb.minY - padY) * h;
  const bw = (bb.maxX - bb.minX + padX * 2) * w, bh = (bb.maxY - bb.minY + padY * 2) * h;

  octx.strokeStyle = '#39ff14';
  octx.lineWidth = 2;
  octx.strokeRect(x, y, bw, bh);

  // context is mirrored (scaleX(-1) on the element via CSS, not canvas) so text drawn normally reads correctly
  octx.font = 'bold 12px Tahoma, sans-serif';
  const labelText = `${label} (${confidence}%)`;
  const metrics = octx.measureText(labelText);
  octx.fillStyle = '#39ff14';
  octx.fillRect(x - 1, y - 16, metrics.width + 8, 15);
  octx.fillStyle = '#000';
  octx.fillText(labelText, x + 3, y - 5);
}

function loop() {
  if (!running) return;
  const now = performance.now();
  if (video.readyState >= 2 && faceLandmarker && (now - lastInferenceTime) >= INFERENCE_INTERVAL_MS) {
    lastInferenceTime = now;
    const results = faceLandmarker.detectForVideo(video, now);
    if (results.faceLandmarks && results.faceLandmarks.length > 0) {
      const lm = results.faceLandmarks[0];

      const ear = (eyeAspectRatio(lm, LEFT_EYE) + eyeAspectRatio(lm, RIGHT_EYE)) / 2;
      const mar = mouthAspectRatio(lm);
      const brow = eyebrowRaise(lm);
      const corner = mouthCornerAngle(lm);
      lastMetrics = { ear, mar, brow, corner };

      const result = classify(lastMetrics);
      const label = typeof result === 'string' ? result : result.label;
      const confidence = typeof result === 'string' ? 68 : result.confidence;

      drawBBoxAndMesh(lm, label, confidence);
      detectedLabel.textContent = label;
      stabilize(label);
    } else {
      octx.clearRect(0, 0, overlay.width, overlay.height);
      detectedLabel.textContent = 'no face';
    }
  }
  requestAnimationFrame(loop);
}

startBtn.addEventListener('click', startCamera);
</script>
</body>
